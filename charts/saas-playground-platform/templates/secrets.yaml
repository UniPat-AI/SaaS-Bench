{{- if or .Values.externalSecret.enabled .Values.verifierJudge.enabled }}
# External Secrets Operator reads service credentials from GCP Secret Manager via Workload
# Identity on the service account.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecret.secretStoreName }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.externalSecret.gcpProject }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.externalSecret.clusterLocation | default "us-central1" }}
          clusterName: {{ .Values.externalSecret.clusterName | default "REPLACE_CLUSTER_NAME" }}
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}
{{- end }}
{{- if .Values.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.k8sSecretName }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecret.k8sSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecret.apiKeyKey }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}
{{- if .Values.verifierJudge.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.verifierJudge.k8sSecretName }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.verifierJudge.k8sSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.verifierJudge.apiKeyKey }}
      remoteRef:
        key: {{ required "verifierJudge.remoteApiKey is required when verifierJudge.enabled=true" .Values.verifierJudge.remoteApiKey }}
{{- end }}
