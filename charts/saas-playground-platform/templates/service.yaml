apiVersion: v1
kind: Service
metadata:
  name: {{ include "pg.name" . }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
spec:
  {{- with .Values.service.type }}
  # ClusterIP when unset (front it with your own Ingress/Gateway). Set LoadBalancer or NodePort
  # to expose the API directly on a cluster that has no ingress controller.
  type: {{ . }}
  {{- end }}
  selector:
    {{- include "pg.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
