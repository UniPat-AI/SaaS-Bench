# Set per run by the playground service (rendered from a compose_template_file via parse_compose +
# render_compose_values, then passed as a values file to `helm upgrade --install run-<id>`).
runId: ""                 # required — unique per eval run; names the release's objects + labels
host: ""                  # required — external hostname, e.g. <runId>.saas-playground.example.com
imagePullPolicy: IfNotPresent

# The web service (the compose service that publishes a port). Listed first so `kubectl exec <pod>`
# (no -c) targets it by default.
mainContainer:
  name: app
  image: ""               # required
  containerPort: 80
  env: []                 # [{name, value}]
  command: []             # k8s command (compose entrypoint)
  args: []                # k8s args (compose command)
  volumeMounts: []        # [{name, mountPath}]

# Aux services (db / redis / etc.) — each a container in the same pod.
sidecars: []              # [{name, image, env, command, args, volumeMounts}]

# Compose service names -> 127.0.0.1 so the web service's inter-service URLs resolve in one pod.
hostAliases: []           # [{ip: 127.0.0.1, hostnames: [<run>, <run>-postgres, ...]}]

# Compose volumes rendered as k8s volume specs. Named volumes become emptyDir; privileged-compatible
# clusters may also receive hostPath specs for apps such as OnlyOffice.
volumes: []               # [{name, emptyDir: {}}] or [{name, hostPath: {path, type}}]

webContainerPort: 80      # the web service's container port (Service targetPort + readiness probe)

resources:
  requests: {cpu: "2", memory: "2Gi", ephemeral-storage: "4Gi"}
  limits: {cpu: "4", memory: "4Gi", ephemeral-storage: "4Gi"}
sidecarResources:
  requests: {cpu: "1", memory: "1Gi", ephemeral-storage: "1Gi"}
  limits: {cpu: "2", memory: "2Gi", ephemeral-storage: "1Gi"}

# Seed init containers (copy baked volume data into emptyDir). Generated by render_compose_values;
# each runs briefly (a single `cp -a`), so initResources are kept small.
initContainers: []
initResources:
  requests: {cpu: "1", memory: "1Gi", ephemeral-storage: "1Gi"}
  limits: {cpu: "2", memory: "2Gi", ephemeral-storage: "1Gi"}

# Propagated from the platform chart; needed when the mw-* images are in a private registry.
imagePullSecrets: []
