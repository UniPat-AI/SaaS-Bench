# Task-G Rollout App Registry
#
# Port formula (docker-run apps): BASE_PORT + slot_id * slot_offset + app_index
# Default: 30000 + slot_id * 40 + app_index
#
# Container naming: rollout_{slot_id}_{app_name}
#
# Fields:
#   app_index            : unique offset within a slot block (0-indexed)
#   fixed_port           : port used in no-isolation mode
#   container_port       : port the service listens on inside the container
#   start                : docker run command; {container}, {port}, {hostname} substituted
#   health_path          : URL path used by readiness probe; accepts 200/301/302/303/401/403
#   extra_health_paths   : optional additional URL paths probed with the same status rules
#   health_bad_markers   : optional response substrings that make an HTTP probe fail
#   health_required_markers: optional response substrings that must appear in every probed body
#   compose_health_services: optional compose service suffixes inspected for healthy/running state
#   startup_wait         : MAX seconds to wait for readiness; raises if not ready in time
#   start_type: compose  : uses compose_template_file instead of docker run
#   compose_template_file: path to .yml.tpl; $prefix, $port, $hostname substituted
#   compose_volumes      : named volume suffixes to remove on stop

apps:

  # -- Software Engineering & Project Management ----------------------------

  code-server:
    app_index: 0
    fixed_port: 6041
    container_port: 8080
    start: >-
      docker run -d --name {container}
      -e PASSWORD=8a128206e2177bce1e48e565 -u 0
      -p {port}:8080
      code-server-bundle:latest
    health_path: "/"
    startup_wait: 900

  openproject:
    app_index: 1
    fixed_port: 6047
    container_port: 80
    start: "docker run -d --name {container} -p {port}:80 -e OPENPROJECT_HOST__NAME={hostname}:{port} -e OPENPROJECT_HTTPS=false -e SECRET_KEY_BASE=secret mw-openproject:latest"
    health_path: "/health_checks/default"
    startup_wait: 360

  metabase:
    app_index: 2
    fixed_port: 6100
    container_port: 80
    start: "docker run -d --name {container} --add-host=host.docker.internal:host-gateway -p {port}:80 mw-metabase:latest"
    health_path: "/"
    startup_wait: 180

  baserow:
    app_index: 3
    fixed_port: 6009
    container_port: 6806
    pg_port_offset: 27  # app_index 3 + 27 = reserved slot index 30 (web apps use 0-22)
    start: "docker run -d --name {container} -p {port}:6806 -p {pg_port}:5432 -e BASEROW_PUBLIC_URL=http://{hostname}:{port} mw-baserow:latest"
    health_path: "/login"
    startup_wait: 600

  # -- Business Operations & Finance ----------------------------------------

  twenty:
    app_index: 4
    fixed_port: 6039
    container_port: 3000
    start: "docker run -d --name {container} -p {port}:3000 -e SERVER_URL=http://{hostname}:{port} mw-twenty:latest"
    health_path: "/healthz"
    startup_wait: 360

  bigcapital:
    app_index: 5
    fixed_port: 6068
    container_port: 80
    start: "docker run -d --name {container} -p {port}:80 mw-bigcapital:latest"
    health_path: "/"
    startup_wait: 180

  hrms:
    app_index: 6
    fixed_port: 6077
    container_port: 8000
    start: "docker run -d --name {container} -p {port}:8000 mw-hrms:latest"
    health_path: "/"
    startup_wait: 1200

  pretix:
    app_index: 7
    fixed_port: 6089
    container_port: 80
    start: >-
      docker run -d --name {container} -p {port}:80
      -e PRETIX_URL=http://{hostname}:{port}
      --entrypoint /bin/bash
      mw-pretix:latest
      -lc "sed -i 's|^url=.*|url=http://{hostname}:{port}|' /etc/pretix/pretix.cfg && exec /entrypoint-mw.sh all"
    health_path: "/control/login"
    extra_health_paths:
      - "/control/"
    health_bad_markers:
      - "Internal Server Error"
      - "Unknown host"
      - "no access to any events"
    startup_wait: 600

  # -- Healthcare Administration ---------------------------------------------

  openemr:
    app_index: 8
    fixed_port: 6085
    container_port: 80
    start: "docker run -d --name {container} -p {port}:80 mw-openemr:latest"
    health_path: "/interface/login/login.php?site=default"
    startup_wait: 1200

  opnform:
    app_index: 9
    fixed_port: 6046
    container_port: 8080
    start: "docker run -d --name {container} -p {port}:8080 -e APP_URL=http://{hostname}:{port} mw-opnform:latest"
    health_path: "/"
    health_bad_markers:
      - "An error occurred while saving the form"
      - "Page not found (404)"
      - "Runtime Error"
    startup_wait: 120

  # -- Team Collaboration & Document Workflow --------------------------------

  onlyoffice:
    app_index: 10
    fixed_port: 6027
    start_type: compose
    compose_template_file: docker/onlyoffice.yml.tpl
    compose_volumes:
      - _mysql_data
      - _es_data
      - _community_data
      - _community_logs
      - _community_letsencrypt
      - _ds_data
      - _ds_logs
      - _ds_cache
      - _ds_files
      - _ds_fonts
    health_path: "/Auth.aspx"
    extra_health_paths:
      - "/Products/Files/Default.aspx"
      - "/ds-vpath/healthcheck"
    health_bad_markers:
      - "Runtime Error"
      - "Service Unavailable"
      - "502 Bad Gateway"
      - "503 Service Temporarily Unavailable"
    compose_health_services:
      - mysql
      - elasticsearch
      - documentserver
      - community
    startup_wait: 600

  mattermost:
    app_index: 11
    fixed_port: 6002
    start_type: compose
    compose_template_file: docker/mattermost.yml.tpl
    compose_volumes:
      - -config
      - -data
      - -logs
      - -plugins
      - -client-plugins
      - -bleve-indexes
      - -pg-data
    health_path: "/api/v4/system/ping"
    startup_wait: 360

  owncloud:
    app_index: 12
    fixed_port: 6018
    start_type: compose
    compose_template_file: docker/owncloud.yml.tpl
    compose_volumes: []
    health_path: "/status.php"
    extra_health_paths:
      - "/index.php/login"
      - "/ocs/v1.php/cloud/capabilities?format=json"
    health_bad_markers:
      - "Internal Server Error"
      - "Service Unavailable"
      - "502 Bad Gateway"
      - "503 Service Temporarily Unavailable"
    compose_health_services:
      - mariadb
      - redis
      - "."
    startup_wait: 360

  roundcubemail:
    app_index: 13
    fixed_port: 7101
    container_port: 80
    start: "docker run -d --name {container} -p {port}:80 --entrypoint /entrypoint-mw.sh mw-roundcubemail:latest"
    health_path: "/"
    health_required_markers:
      - "Roundcube Webmail"
    health_bad_markers:
      - "Internal Server Error"
    startup_wait: 180

  # -- Agriculture / Media New Apps --------------------------------------------------

  grocy:
    app_index: 14
    fixed_port: 7079
    container_port: 80
    start: "docker run -d --name {container} -p {port}:80 mw-grocy:latest"
    health_path: "/"
    startup_wait: 60

  recipya:
    app_index: 15
    fixed_port: 7033
    container_port: 8078
    start: "docker run -d --name {container} -p {port}:8078 -e RECIPYA_SERVER_URL=http://{hostname}:{port} mw-recipya:latest"
    health_path: "/"
    startup_wait: 60

  farmos:
    app_index: 16
    fixed_port: 7038
    container_port: 80
    start: "docker run -d --name {container} -p {port}:80 mw-farmos:latest"
    health_path: "/"
    startup_wait: 120

  e-label:
    app_index: 17
    fixed_port: 6055
    container_port: 8080
    start: "docker run -d --ulimit nofile=65535:65535 --name {container} -p {port}:8080 mw-elabel:latest"
    health_path: "/"
    startup_wait: 600

  siyuan:
    app_index: 18
    fixed_port: 7037
    container_port: 6806
    start: "docker run -d --name {container} -p {port}:6806 -e SIYUAN_ACCESS_AUTH_CODE=siyuan6037 mw-siyuan:latest"
    health_path: "/"
    startup_wait: 300

  watcharr:
    app_index: 19
    fixed_port: 7043
    container_port: 3080
    start: "docker run -d --name {container} -p {port}:3080 -e HTTP_PROXY -e HTTPS_PROXY -e ALL_PROXY -e NO_PROXY -e http_proxy -e https_proxy -e all_proxy -e no_proxy mw-watcharr:latest"
    health_path: "/"
    extra_health_paths:
      - "/login"
    startup_wait: 60

  booklore:
    app_index: 20
    fixed_port: 7004
    container_port: 6004
    start: "docker run -d --name {container} -p {port}:6004 mw-booklore:latest"
    health_path: "/"
    startup_wait: 60

  mediacms:
    app_index: 21
    fixed_port: 6024
    container_port: 80
    start: "docker run -d --name {container} -p {port}:80 mw-mediacms:latest"
    health_path: "/"
    startup_wait: 120

  photoprism:
    app_index: 22
    fixed_port: 6103
    container_port: 2342
    start: "docker run -d --name {container} -p {port}:2342 -e PHOTOPRISM_SITE_URL=http://{hostname}:{port}/ mw-photoprism:latest"
    health_path: "/api/v1/status"
    startup_wait: 300
