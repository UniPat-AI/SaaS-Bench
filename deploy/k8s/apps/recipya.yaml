apiVersion: v1
kind: Namespace
metadata:
  name: saasbench-recipya
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipya
  namespace: saasbench-recipya
  labels: &id001
    app: recipya
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: recipya
        image: mw-recipya:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8078
        env:
        - name: RECIPYA_SERVER_URL
          value: http://localhost
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 180
          periodSeconds: 10
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: recipya
  namespace: saasbench-recipya
  labels: &id001
    app: recipya
spec:
  type: NodePort
  selector: *id001
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30115
