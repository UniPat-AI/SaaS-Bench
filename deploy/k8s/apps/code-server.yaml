apiVersion: v1
kind: Namespace
metadata:
  name: saasbench-code-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: saasbench-code-server
  labels: &id001
    app: code-server
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: code-server
        image: code-server-bundle:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: PASSWORD
          value: 8a128206e2177bce1e48e565
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 180
          periodSeconds: 10
          failureThreshold: 30
        securityContext:
          runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: code-server
  namespace: saasbench-code-server
  labels: &id001
    app: code-server
spec:
  type: NodePort
  selector: *id001
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30100
