apiVersion: v1
kind: Namespace
metadata:
  name: saasbench-photoprism
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism
  namespace: saasbench-photoprism
  labels: &id001
    app: photoprism
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: photoprism
        image: mw-photoprism:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 2342
        env:
        - name: PHOTOPRISM_SITE_URL
          value: http://localhost/
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 180
          periodSeconds: 10
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: photoprism
  namespace: saasbench-photoprism
  labels: &id001
    app: photoprism
spec:
  type: NodePort
  selector: *id001
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30122
