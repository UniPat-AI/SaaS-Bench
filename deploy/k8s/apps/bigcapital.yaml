apiVersion: v1
kind: Namespace
metadata:
  name: saasbench-bigcapital
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bigcapital
  namespace: saasbench-bigcapital
  labels: &id001
    app: bigcapital
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: bigcapital
        image: mw-bigcapital:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 180
          periodSeconds: 10
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bigcapital
  namespace: saasbench-bigcapital
  labels: &id001
    app: bigcapital
spec:
  type: NodePort
  selector: *id001
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30105
