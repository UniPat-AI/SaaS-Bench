apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-content
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  server.py: |
    import json
    import os
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    DEFAULT_RESULT = {
        "task_id": {{ .Values.result.defaultTaskId | quote }},
        "passed": {{ ternary "True" "False" .Values.result.defaultPassed }},
        "score": {{ .Values.result.defaultScore }},
        "checks": [],
    }

    _lock = threading.Lock()
    _reset_count = 0
    _state = None


    def default_state():
        return {
            "status": "ready",
            "reset_count": _reset_count,
            "result": dict(DEFAULT_RESULT),
        }


    def reset_state():
        global _reset_count, _state
        with _lock:
            _reset_count += 1
            _state = default_state()
            return _state


    reset_state()


    class Handler(BaseHTTPRequestHandler):
        def _json(self, status, payload):
            body = json.dumps(payload).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def _text(self, status, body, content_type="text/plain"):
            data = body.encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/healthz":
                self._json(200, {"status": "ok"})
            elif self.path == "/result":
                with _lock:
                    self._json(200, _state)
            elif self.path == "/":
                self._text(
                    200,
                    "<!doctype html><title>SaaS-Bench Kubernetes Smoke</title>"
                    "<h1>SaaS-Bench Kubernetes Smoke</h1>",
                    "text/html",
                )
            else:
                self._json(404, {"error": "not found"})

        def do_POST(self):
            length = int(self.headers.get("Content-Length", "0"))
            raw = self.rfile.read(length) if length else b"{}"
            try:
                payload = json.loads(raw.decode("utf-8") or "{}")
            except json.JSONDecodeError:
                self._json(400, {"error": "invalid json"})
                return

            if self.path == "/reset":
                self._json(200, reset_state())
            elif self.path == "/set-result":
                result = payload.get("result", payload)
                with _lock:
                    _state["status"] = "ready"
                    _state["result"] = {
                        "task_id": result.get("task_id", {{ .Values.result.defaultTaskId | quote }}),
                        "passed": bool(result.get("passed", False)),
                        "score": float(result.get("score", 0.0)),
                        "checks": result.get("checks", []),
                    }
                    self._json(200, _state)
            else:
                self._json(404, {"error": "not found"})

        def log_message(self, fmt, *args):
            print("fake-site %s - %s" % (self.address_string(), fmt % args), flush=True)


    port = int(os.environ.get("PORT", "{{ .Values.containerPort }}"))
    ThreadingHTTPServer(("0.0.0.0", port), Handler).serve_forever()
